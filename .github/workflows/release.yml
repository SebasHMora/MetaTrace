name: Compilar y publicar MetaTrace

on:
  push:
    tags:
      - 'v*'

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci instala EXACTAMENTE lo que dice package-lock.json (a diferencia de
      # "npm install", que puede traer versiones nuevas). Así el build publicado es
      # reproducible y una dependencia transitiva alterada no se cuela sola.
      - name: Instalar dependencias (desde el lockfile)
        run: npm ci

      # Informa vulnerabilidades conocidas en las dependencias. No bloquea la
      # publicación (continue-on-error), pero deja el reporte visible en el log.
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Compilar y publicar en GitHub Releases
        run: npm run publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
